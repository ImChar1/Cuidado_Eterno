spring:
  application:
    name: cuidado-eterno-backend

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/cuidado_eterno}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate        # nunca 'create' o 'update' en producción
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true

# ── JWT ────────────────────────────────────────────────────────────────────────
jwt:
  # Mínimo 32 caracteres aleatorios. En producción viene de variable de entorno.
  secret: ${JWT_SECRET:cuidadoEternoSecretKeyMustBe32CharsMin!}
  # Tiempo de expiración en milisegundos (24 horas)
  expiration: ${JWT_EXPIRATION:86400000}

# ── Swagger / OpenAPI ──────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    # En producción puedes deshabilitar Swagger con una variable de entorno
    enabled: ${SWAGGER_ENABLED:true}

# ── Server ─────────────────────────────────────────────────────────────────────
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1