spring.application.name=backend

server.port=8080
server.address=0.0.0.0

# ── Base de datos MariaDB ──────────────────────────────────────
# En local Docker: DB_URL=jdbc:mariadb://db:3306/cuidado_eterno
# En AWS EC2:      DB_URL=jdbc:mariadb://<IP_PRIVADA>:3306/cuidado_eterno
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/cuidado_eterno}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ── Hikari connection pool ─────────────────────────────────────
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# ── JPA / Hibernate ────────────────────────────────────────────
# validate: Hibernate verifica que las entidades coinciden con las tablas
# pero NO las modifica. El DDL SQL es la fuente de verdad.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true

# Evita fallo si la BD tarda en estar lista al arrancar
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# ── Actuator (health check para Docker) ───────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# ── JWT ────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:cuidadoEternoSecretKeyMustBe32CharsMin!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── Swagger ────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.path=/api-docs