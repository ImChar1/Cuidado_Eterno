# ============================================================
# application.yml
# Ubicación: backend/src/main/resources/application.yml
#
# QUÉ HACE:
#   Configura Spring Boot. Todas las variables sensibles usan
#   la sintaxis ${VARIABLE:valor_por_defecto}, donde:
#   - En desarrollo local: usa el valor por defecto (después de los :)
#   - En Docker: docker-compose inyecta las variables reales
#   - En AWS EC2: las variables vienen del entorno del sistema
#
# CÓMO SE COMUNICA:
#   Spring Boot lee este archivo al arrancar.
#   JwtConfig.java mapea el bloque "jwt:" a una clase Java.
#   El bloque "datasource" le dice a Hibernate cómo conectar a MariaDB.
# ============================================================

spring:
  application:
    name: cuidado-eterno-backend

  # ── Base de datos ───────────────────────────────────────────
  # DB_URL en docker-compose apunta al servicio "db" por nombre:
  #   jdbc:mariadb://db:3306/cuidado_eterno
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/cuidado_eterno}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.mariadb.jdbc.Driver

  # ── JPA / Hibernate ─────────────────────────────────────────
  jpa:
    hibernate:
      # validate: Hibernate comprueba que las entidades coinciden
      # con las tablas pero NO las modifica. Falla si hay diferencia.
      # Así el DDL (cuidado_eterno_mysql.sql) es la fuente de verdad.
      ddl-auto: validate
    show-sql: false
    open-in-view: false   # evita lazy loading fuera de transacción
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true

# ── JWT ──────────────────────────────────────────────────────
# Mapeado por JwtConfig.java con @ConfigurationProperties(prefix="jwt")
# El secret NUNCA debe tener valor por defecto en producción.
# En AWS el secret viene de AWS Secrets Manager o Parameter Store.
jwt:
  secret: ${JWT_SECRET:cuidadoEternoSecretKeyMustBe32CharsMin!}
  expiration: ${JWT_EXPIRATION:86400000}   # 24 horas en milisegundos

# ── Swagger / OpenAPI ────────────────────────────────────────
# Deshabilitar en producción con SWAGGER_ENABLED=false en el entorno.
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}

# ── Servidor ─────────────────────────────────────────────────
# context-path: todas las rutas empiezan con /api/v1
# Ej: POST http://localhost:8080/api/v1/auth/login
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1