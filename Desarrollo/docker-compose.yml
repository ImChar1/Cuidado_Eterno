# ============================================================
# docker-compose.yml
# Ubicación: raíz del proyecto (CUIDADO_ETERNO/Desarrollo/)
#
# QUÉ HACE:
#   Orquesta los dos contenedores para desarrollo local:
#   - db:      imagen MariaDB 11 con la BD inicializada
#   - backend: imagen Spring Boot construida desde el Dockerfile
#
# CÓMO SE COMUNICA:
#   Lee las variables del archivo .env en la misma carpeta.
#   Inyecta esas variables como variables de entorno en cada contenedor.
#   El backend usa "db" como hostname para conectar a MariaDB porque
#   Docker Compose crea una red interna donde los servicios se
#   resuelven por nombre. "db" apunta a la IP interna del contenedor.
#
# USO:
#   Levantar todo:    docker-compose up -d
#   Ver logs:         docker-compose logs -f
#   Detener todo:     docker-compose down
#   Borrar volúmenes: docker-compose down -v
# ============================================================

services:

  # ── Base de datos MariaDB ─────────────────────────────────
  db:
    build:
      # Contexto: la raíz de Desarrollo/ donde está el docker-compose.yml
      # Dockerfile: ruta relativa desde ese contexto
      context: .
      dockerfile: infra/db/Dockerfile
 
    container_name: cuidado_eterno_db
    restart: unless-stopped
 
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
 
    ports:
      - "3306:3306"
 
    volumes:
      # Solo el volumen de datos — los scripts ya están en la imagen
      - db_data:/var/lib/mysql
 
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    
    networks:
      - cuidado_eterno_net

  # ── Backend Spring Boot ───────────────────────────────────
  backend:
    build:
      # Docker busca el Dockerfile en backend/Dockerfile
      # (imagen 2 de tu estructura: backend/Dockerfile)
      context: ./backend
      dockerfile: Dockerfile

    container_name: cuidado_eterno_backend
    restart: unless-stopped

    ports:
      # Puerto 8080: Android y Swagger acceden por aquí en desarrollo
      - "8080:8080"

    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}

    #depends_on:
      #db:
        # El backend no arranca hasta que la BD pase el healthcheck
        #condition: service_healthy

    # Red explícita para que ambos servicios se comuniquen por nombre
    networks:
      - cuidado_eterno_net

# La BD también se conecta a la misma red interna
networks:
  cuidado_eterno_net:
    driver: bridge

volumes:
  # Volumen nombrado gestionado por Docker.
  # Los datos persisten aunque el contenedor se elimine.
  # Solo se pierden con: docker-compose down -v
  db_data: